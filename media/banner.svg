<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">uxi</title>
  <desc id="d">A UX research and UI design skill for Claude Code. Five-rung audit ladder: Access, Orientation, Task, Coherence, Honesty, with Access highlighted because findings report bottom-up.</desc>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <rect width="1280" height="320" fill="#16181d"/>

  <!-- wordmark block, left margin 88, 4px rhythm -->
  <text x="88" y="148" class="sans" font-size="92" font-weight="700" letter-spacing="-3" fill="#ffffff">uxi</text>
  <rect x="90" y="168" width="64" height="6" rx="3" fill="#60a5fa"/>
  <text x="88" y="220" class="sans" font-size="24" fill="#aeb6c2">A UX research and UI design skill for Claude Code</text>
  <text x="88" y="260" class="mono" font-size="16" fill="#8b95a5">#9aa3af on #ffffff&#160;&#160;ratio 2.55:1&#160;&#160;AA(text, 4.5:1) <tspan fill="#f87171">FAIL</tspan></text>

  <!-- the five-rung ladder, reported bottom-up: rung 1 is the one that blocks -->
  <g class="mono" font-size="15">
    <rect x="880" y="36" width="312" height="40" rx="10" fill="#1d2026" stroke="#67707e"/>
    <text x="904" y="61" fill="#aeb6c2">5<tspan fill="#67707e" dx="10">&#183;</tspan><tspan dx="10">Honesty</tspan></text>

    <rect x="880" y="88" width="312" height="40" rx="10" fill="#1d2026" stroke="#67707e"/>
    <text x="904" y="113" fill="#aeb6c2">4<tspan fill="#67707e" dx="10">&#183;</tspan><tspan dx="10">Coherence</tspan></text>

    <rect x="880" y="140" width="312" height="40" rx="10" fill="#1d2026" stroke="#67707e"/>
    <text x="904" y="165" fill="#aeb6c2">3<tspan fill="#67707e" dx="10">&#183;</tspan><tspan dx="10">Task completion</tspan></text>

    <rect x="880" y="192" width="312" height="40" rx="10" fill="#1d2026" stroke="#67707e"/>
    <text x="904" y="217" fill="#aeb6c2">2<tspan fill="#67707e" dx="10">&#183;</tspan><tspan dx="10">Orientation</tspan></text>

    <rect x="880" y="244" width="312" height="40" rx="10" fill="#60a5fa"/>
    <text x="904" y="269" fill="#16181d" font-weight="700">1<tspan fill="#16181d" dx="10">&#183;</tspan><tspan dx="10">Access</tspan></text>
  </g>
</svg>
